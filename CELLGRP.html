<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>西式燒味飯系列 - 線上點餐</title>
    <style>
        :root {
            --primary-color: #00A650; /* AlipayHK 官方綠 */
            --bg-color: #F6F7FB;
            --card-bg: #FFFFFF;
            --text-main: #1D2129;
            --text-sub: #86909C;
            --accent-red: #F53F3F;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* 頂部 Header */
        header {
            background: var(--card-bg);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .phone-badge {
            font-size: 13px;
            background-color: #E8FFEA;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* 菜單列表 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .food-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .food-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-red);
        }

        .food-price::before {
            content: "HK$ ";
            font-size: 13px;
        }

        /* 數量加減按鈕 */
        .control-btn {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            outline: none;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-minus {
            background-color: #F2F3F5;
            color: #4E5969;
        }

        .btn-plus {
            background-color: var(--primary-color);
            color: #FFFFFF;
        }

        .item-count {
            font-size: 15px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        /* 底部購物車 */
        .cart-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #FFFFFF;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99;
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .total-price {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-red);
        }

        .total-price::before {
            content: "HK$ ";
            font-size: 15px;
        }

        .pay-btn {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 166, 80, 0.3);
        }

        .pay-btn:disabled {
            background-color: #C9CDD4;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .highlight-box {
            background: #F2F3F5;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
        }

        .highlight-box div {
            margin-bottom: 6px;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-confirm {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .btn-cancel {
            background: none;
            border: none;
            color: var(--text-sub);
            padding: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .browser-notice {
            background-color: #FFF7E8;
            color: #FF7D00;
            padding: 10px 16px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="browser-notice" id="browserNotice">
        ⚠ 如在 App 內無法開啟，請點擊右上角選擇「在 Safari / 瀏覽器開啟」
    </div>

    <header>
        <h1>西式燒味飯系列</h1>
        <span class="phone-badge">AlipayHK: 51695639</span>
    </header>

    <div class="container">
        <div class="menu-grid" id="menuList"></div>
    </div>

    <div class="cart-bar">
        <div class="cart-info">
            <span class="cart-label">應付金額</span>
            <span class="total-price" id="totalPrice">0</span>
        </div>
        <button class="pay-btn" id="payBtn" disabled onclick="openPayModal()">
            前往 AlipayHK 付款
        </button>
    </div>

    <!-- 提示彈窗 -->
    <div class="modal-overlay" id="payModal">
        <div class="modal-card">
            <div class="modal-title">開啟 AlipayHK 轉賬</div>
            <div class="modal-desc">
                已自動複製金額，點擊下方按鈕直接開啟 **AlipayHK (香港版)**。
            </div>
            <div class="highlight-box">
                <div>📞 收款號碼：<strong>51695639</strong></div>
                <div>💰 轉賬金額：<strong id="modalAmount" style="color:var(--accent-red);">HK$ 0</strong></div>
            </div>
            <div class="modal-actions">
                <button class="btn-confirm" onclick="redirectToAlipayHK()">開啟 AlipayHK (香港版)</button>
                <button class="btn-cancel" onclick="closePayModal()">返回修改餐點</button>
            </div>
        </div>
    </div>

    <script>
        const menuData = [
            { id: 1, name: "招牌燒豬手飯", price: 42 },
            { id: 2, name: "惹味燒春雞飯", price: 42 },
            { id: 3, name: "醬燒豬肋骨飯", price: 42 },
            { id: 4, name: "鹽燒鯖魚柳飯", price: 42 },
            { id: 5, name: "黑糖豬頸肉飯", price: 40 },
            { id: 6, name: "黑椒焗鴨胸飯", price: 40 },
            { id: 7, name: "德式烤腸仔飯", price: 40 },
            { id: 8, name: "蜜餞焗叉燒飯", price: 40 },
            { id: 9, name: "黑椒烤薰蹄飯", price: 38 },
            { id: 10, name: "自家燒腩仔飯", price: 38 },
            { id: 11, name: "蜜味烤雞髀飯", price: 38 },
            { id: 12, name: "辣味烤雞髀飯", price: 38 },
            { id: 13, name: "香茅烤雞扒飯", price: 38 },
            { id: 14, name: "白飯", price: 12 }
        ];

        const targetPhone = "51695639";
        const cart = {};

        function renderMenu() {
            const menuContainer = document.getElementById('menuList');
            menuContainer.innerHTML = menuData.map(item => `
                <div class="food-card">
                    <div class="food-info">
                        <h3>${item.name}</h3>
                        <div class="food-price">${item.price}</div>
                    </div>
                    <div class="control-btn">
                        <button class="btn-circle btn-minus" onclick="updateCart(${item.id}, -1)">-</button>
                        <span class="item-count" id="count-${item.id}">0</span>
                        <button class="btn-circle btn-plus" onclick="updateCart(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function updateCart(id, change) {
            const currentQty = cart[id] || 0;
            const newQty = Math.max(0, currentQty + change);
            if (newQty === 0) {
                delete cart[id];
            } else {
                cart[id] = newQty;
            }
            document.getElementById(`count-${id}`).innerText = newQty;
            calculateTotal();
        }

        function calculateTotal() {
            let total = 0;
            for (const id in cart) {
                const item = menuData.find(m => m.id == id);
                if (item) total += item.price * cart[id];
            }
            document.getElementById('totalPrice').innerText = total;
            document.getElementById('payBtn').disabled = total === 0;
            return total;
        }

        function openPayModal() {
            const total = calculateTotal();
            if (total === 0) return;
            document.getElementById('modalAmount').innerText = `HK$ ${total}`;
            document.getElementById('payModal').style.display = 'flex';
        }

        function closePayModal() {
            document.getElementById('payModal').style.display = 'none';
        }

        function redirectToAlipayHK() {
            const total = calculateTotal();

            // 複製金額到剪貼簿
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(`${total}`).catch(() => {});
            }

            // 使用香港版專用 Deep Link/Universal Link
            // 避開內地版 alipays:// 搶占
            const hkUniversalLink = "https://hk.alipay.com/p/app/transfer/index?phone=" + targetPhone;
            const hkScheme = "alipayshk://platformapi/startapp?appId=20000067";

            // 優先嘗試香港版專用 scheme，失敗則使用香港版 universal link
            let isAppOpened = false;
            
            window.location.href = hkScheme;

            setTimeout(() => {
                window.location.href = hkUniversalLink;
            }, 300);

            closePayModal();
        }

        function checkEnvironment() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes('micromessenger') || ua.includes('line')) {
                document.getElementById('browserNotice').style.display = 'block';
            }
        }

        window.onload = function() {
            renderMenu();
            checkEnvironment();
        };
    </script>
</body>
</html>
